name: 광고 소재 자동 수집

on:
  schedule:
    - cron: "0 0 * * *"      # 매일 오전 9시 (한국 시간)
  workflow_dispatch:          # Actions 탭에서 'Run workflow'로 바로 실행 가능

permissions:
  contents: write

concurrency:
  group: ad-archive
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 필요한 프로그램 설치
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 수집 + AI 분석
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python pipeline/run.py

      - name: 결과 저장 (사이트 자동 반영)
        run: |
          git config user.name "ad-archive-bot"
          git config user.email "ad-archive-bot@users.noreply.github.com"
          git add data images
          if git diff --cached --quiet; then
            echo "새로 수집된 소재가 없어요"
          else
            git commit -m "광고 소재 자동 수집 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push
          fi
