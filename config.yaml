# ─────────────────────────────────────────────
# 경쟁사 광고 소재 아카이브 설정
# 브랜드를 추가하거나 주소를 바꾸고 싶으면 이 파일만 고치면 돼요.
#
# 브랜드 하나는 이렇게 생겼어요:
#   - name: 브랜드 이름
#     category: 화장품 또는 디바이스
#     aliases: [영문 이름]     ← 공식몰이 맞는지 확인할 때 쓰는 다른 이름
#     official_pages:
#       - url: "공식몰 주소"
#         region: "국내"       ← 해외몰이면 나라 이름 (미국, 일본 …)
#     pdp_auto: 2              ← 메인에 걸린 대표 제품 상세페이지 몇 개를 가져올지 (0이면 안 가져옴)
