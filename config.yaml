# ─────────────────────────────────────────────
# 경쟁사 광고 소재 아카이브 설정
# 브랜드를 추가하거나 주소를 바꾸고 싶으면 이 파일만 고치면 돼요.
# 주소가 비어 있는("") 항목은 수집할 때 자동으로 건너뜁니다.
# ─────────────────────────────────────────────

# 내가 지원하는 회사 (사이트에서 '기준 브랜드'로 강조 표시돼요)
focus_brand: 메디큐브

brands:
  - name: 메디큐브
    official_pages:          # 공식몰 메인, 이벤트 페이지 주소
      - ""                   # 예: 공식몰 메인 주소
      - ""                   # 예: 공식몰 '이벤트' 메뉴 주소
    pdp_pages:               # 꼭 보고 싶은 제품 상세페이지 주소 (선택)
      - ""
    instagram: ""            # 인스타 아이디 (@ 빼고). 비즈니스/크리에이터 계정만 가능

  - name: 아누아
    official_pages: [""]
    pdp_pages: []
    instagram: ""

  - name: 바이오던스
    official_pages: [""]
    pdp_pages: []
    instagram: ""

  # 브랜드를 더 넣고 싶으면 위 블록을 복사해서 이름만 바꾸면 돼요.

retail:
  - name: 올리브영
    main_url: "https://www.oliveyoung.co.kr/store/main/main.do"
    # 메인에서 이 이름의 메뉴를 자동으로 눌러 기획전 목록으로 들어가요.
    promo_menu_text: "기획전"
    # 랭킹 상위 제품의 상세페이지를 자동 수집해요.
    ranking_url: "https://www.oliveyoung.co.kr/store/main/getBestList.do"
    ranking_top_n: 10
    # 상품 상세페이지 주소에 들어가는 공통 문자열 (랭킹 페이지에서 상품 링크를 찾을 때 사용)
    product_link_pattern: "getGoodsDetail.do"

collect:
  max_banners_per_page: 8      # 한 페이지에서 가져올 배너 최대 수
  min_banner_width: 600        # 이보다 작은 이미지는 배너로 보지 않아요
  delay_seconds: [3, 6]        # 페이지 사이 대기 시간(초). 사이트에 부담 주지 않도록
  user_agent: "BeautyAdArchiveBot/1.0 (portfolio research; weekly)"
  respect_robots_txt: true     # robots.txt에서 막힌 페이지는 자동으로 건너뛰어요

instagram:
  posts_per_brand: 12
  graph_api_version: "v23.0"   # Meta 그래프 API 버전. 오래되면 최신 버전으로 바꿔주세요

analysis:
  model: "claude-haiku-5-5"   # 비용을 아끼려면 "claude-haiku-5-5"
  max_items_per_run: 60        # 한 번 실행할 때 분석할 최대 소재 수
